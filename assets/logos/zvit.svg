<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Dark Border -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#231F20" stroke-width="2.5"/>
  <!-- Top Orange Half -->
  <path d="M 4 48 A 46 46 0 0 1 96 48 Z" fill="#FF5E00"/>
  
  <!-- Delivery Scooter & Driver (Silhouette in Top Half) -->
  <g transform="translate(24, 10) scale(0.68)">
    <!-- Helmet & Head -->
    <circle cx="38" cy="12" r="7" fill="#FFFFFF"/>
    <path d="M 28 24 Q 38 16 48 24 L 46 32 L 28 32 Z" fill="#FFFFFF"/>
    <!-- Yellow Delivery Box on back -->
    <rect x="14" y="20" width="14" height="15" rx="2" fill="#F8C300" stroke="#231F20" stroke-width="1.5"/>
    <!-- Scooter Chassis & Wheels -->
    <circle cx="16" cy="42" r="7" fill="#231F20"/>
    <circle cx="16" cy="42" r="3" fill="#FFFFFF"/>
    <circle cx="54" cy="42" r="7" fill="#231F20"/>
    <circle cx="54" cy="42" r="3" fill="#FFFFFF"/>
    <path d="M 16 42 L 32 42 L 40 28 L 50 28 L 54 42" stroke="#FFFFFF" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Z-VIT Oval Badge in Bottom Half -->
  <g transform="translate(0, 48)">
    <rect x="16" y="5" width="68" height="23" rx="11.5" fill="#FFFFFF" stroke="#231F20" stroke-width="2.5"/>
    <text x="50" y="21" text-anchor="middle" font-family="'Manrope', 'Impact', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#231F20" letter-spacing="1">Z-VIT</text>
    <!-- express script underneath -->
    <text x="50" y="38" text-anchor="middle" font-family="'Brush Script MT', 'Segoe Script', 'Manrope', cursive, sans-serif" font-size="11" font-weight="700" fill="#E62A10" font-style="italic">express</text>
  </g>
</svg>
